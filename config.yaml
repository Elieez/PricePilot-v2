# The Discord webhook comes from the DISCORD_WEBHOOK environment variable
# (a repository secret in GitHub Actions). It is never stored in this file.

run:
  jitter_ms: [800, 1600]           # pause between requests to ASOS

filters:
  exclude_brands: []

monitors:
  # Scans whole categories in the Swedish store and compares every
  # price with the same product in the reference stores. Alerts only when the
  # Swedish price is far below what every reference store implies.
  - name: "ASOS men"
    slug: "asos-men-new"
    adapter: "asos_api"
    # Scanned together and merged by product id, so a product is judged (and alerted) once.
    category_ids:
      - 27110   # men's new in (~4,100 items)
      # - 4209  # men's shoes, boots & trainers (~2,850 items; doubles the requests per run)
    # Product ids checked every run even if no category above lists them (one request each).
    # The id is the number after /prd/ in the product URL.
    watch_ids:
      - 210252533   # adidas Samba, the 110 SEK error: ASOS dropped it from the category listings
    store: SE
    country: SE
    lang: sv-SE
    currency: SEK
    reference_stores:
      - {name: GB, store: COM, country: GB, lang: en-GB, currency: GBP}
      - {name: DE, store: DE, country: DE, lang: de-DE, currency: EUR}
    mention_on_bug: ""             # e.g. "@here" to get pinged on every alert
    scoring:
      error_ratio: 0.5             # alert at <= 50% of the price the other stores imply
      min_saving: 250              # SEK below the expected price, filters out cheap basics
      min_matched: 200             # items in common needed to trust a store's price ratio
      max_alerts_per_run: 10
      alert_sold_out: true         # report sold-out errors too (grey). Either way: one alert per product, ever
      max_lookup_requests: 120     # cap on by-id reference lookups per run (only the first run needs many)
    filters:
      # Own-label and budget brands: not worth reselling even when mispriced.
      exclude_brands: ["asos design", "Lost Souls", "Lost", "Jack & Jones", "Classics 77", "Topman", "COLLUSION", "JJ Rebel", "Cotton On", "Reclaimed Vintage", "Bershka", "Only & Sons", "new look", "pull&bear"]
