name: PricePilot Monitor

on:
  schedule:
    - cron: "7 * * * *" # hourly, off the top of the hour (GitHub delays :00 jobs the most)
  workflow_dispatch: {}

# Never two scans at once: they would double the request rate and race on state.
concurrency:
  group: pricepilot-monitor
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # allow committing updated state files
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install deps
        run: pip install -r requirements.txt

      # Exits non-zero when the scan failed or was blocked, which fails the job
      # (so it shows red and GitHub notifies you) and skips the state commit.
      - name: Run monitor
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: python monitor.py

      - name: Commit state changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/*.json || true
          if git diff --cached --quiet; then
            echo "No state changes"
          else
            git commit -m "Update state ($(date -u +%FT%TZ))"
            git pull --rebase
            git push
          fi
